[project]
site_name = "PhreakBoutique Docs"
site_url = "https://docs.phreakboutique.com/"
site_description = "Setup guides for gear from PhreakBoutique: Evil USB Cable, PwnPixel, ESP32 Marauder, Pwnagotchi and Proxmark3 Easy."
site_author = "Ben 'Marbas' Strout"
copyright = "&copy; 2026 PhreakBoutique &middot; Supporting DC207 and the Maine hacker community"
repo_url = "https://github.com/PhreakBoutique/phreak-docs"
repo_name = "PhreakBoutique/phreak-docs"
edit_uri = "edit/main/docs/"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Start here" = "index.md" },
  { "Evil USB Cable & PwnPixel" = [
    "hid/index.md",
    { "Set up your computer" = "hid/setup.md" },
    { "Write your own payloads" = "hid/payloads.md" },
    { "Troubleshooting" = "hid/troubleshooting.md" },
  ] },
  { "ESP32 Marauder" = "marauder/index.md" },
  { "Pwnagotchi" = "pwnagotchi/index.md" },
  { "Proxmark3 Easy" = "proxmark3/index.md" },
  { "Use it responsibly" = "responsible-use.md" },
  { "What the duck?" = "duck.md" },
  { "Get help" = "support.md" },
]

[project.theme]
language = "en"
favicon = "assets/favicon.png"
logo = "assets/mark.png"
features = [
  "content.action.edit",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "lucide/shopping-bag"
link = "https://phreakboutique.com/"
name = "Shop"

[[project.extra.social]]
icon = "lucide/mail"
link = "mailto:support@phreakboutique.com"
name = "Email support"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
